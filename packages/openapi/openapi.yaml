openapi: 3.1.0
info:
  title: Test IQ Ku API
  version: 0.1.0
  description: API contract for the IQ testing platform.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/register:
    post:
      summary: Register a new public user account
  /api/v1/auth/login:
    post:
      summary: Login user
  /api/v1/auth/logout:
    post:
      summary: Logout current session
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
  /api/v1/auth/session:
    get:
      summary: Get current session
  /api/v1/test-config/active:
    get:
      summary: Get active test configuration for user dashboard
  /api/v1/test-attempts/start:
    post:
      summary: Start a new IQ test attempt
  /api/v1/test-attempts/current:
    get:
      summary: Get in-progress attempt
  /api/v1/test-attempts/{attemptId}:
    get:
      summary: Get attempt detail
  /api/v1/test-attempts/{attemptId}/answers:
    put:
      summary: Save attempt answers
  /api/v1/test-attempts/{attemptId}/submit:
    post:
      summary: Submit attempt
  /api/v1/results/me/latest:
    get:
      summary: Get latest result
  /api/v1/admin/questions:
    get:
      summary: List questions
    post:
      summary: Create question
  /api/v1/admin/questions/{questionId}:
    patch:
      summary: Update question
    delete:
      summary: Archive question
  /api/v1/admin/users:
    get:
      summary: List users
    post:
      summary: Create user
  /api/v1/admin/users/{userId}:
    patch:
      summary: Update user
  /api/v1/admin/results:
    get:
      summary: List test results
  /api/v1/admin/test-config:
    get:
      summary: Get active test configuration
    patch:
      summary: Update test configuration
